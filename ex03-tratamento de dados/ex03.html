<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Aprendendo JS</h1>
    </header>

    <main>
        <h1>Olá, mundo!</h1>
        <p>Já me livrei da maldição!</p>
    </main>

    <script>
        var n1 = Number(window.prompt('Digite um número:' ))
        var n2 = Number(window.prompt('Digite outro número:' ))
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) //se for cnverter para string o exemplo acima usa String(s) ou s.toString()
       
        // O + pode ser concatenação
        // Mas o + também pode ser usado para adição
        // (nummber + number) para adição
        // (string + string) para concatenação
        // Number.parseInt = para números inteiros
        // Number.parseFloat = para números reais
        // Number = para inteiros ou reais 
    </script>
</body>
</html>
