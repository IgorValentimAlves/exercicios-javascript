<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
    <style>
        body {
            background: rgb(145, 145, 252);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando os estudos de DOM</h1>
    <p name="p0">Aqui vai o resultado</p>
    <p>Aprendendo a usar <strong>DOM</strong> em JavaScript.</p>
    <p class="p2">Treinando DOM</p>
    <p class="aprendi">Agora vai!</p>
    <div id="msg">Clique aqui </div>

    <h2>querySelector()</h2>
    <p>Treinando</p>
    <div id="sel">id</div>
    
</body>
<script>
    var corpo = window.document.body
    var p1 = window.document.getElementsByTagName('p')[1]
    corpo.style.background = 'black'
    p1.style.color = 'red'
    document.write(`no parágrafo 2 está escrito: '${p1.innerHTML}'`)

    var d = window.document.getElementById('msg')
    d.style.background = 'green'
    d.innerText = 'Estou aguardando'

    var p0 = window.document.getElementsByName('p0')[0]
    p0.innerText = 'Olá!'

    var p2 = window.document.getElementsByClassName('p2')[0]
    p2.innerText = 'Funcionou'

    var aprendi = window.document.getElementsByClassName('aprendi')[0]
    aprendi.innerText = 'Foi'
    aprendi.style.color = 'pink'

    var sel = window.document.querySelector('div#sel')
    sel.style.color = 'yellow'

    
</script>
</html>
