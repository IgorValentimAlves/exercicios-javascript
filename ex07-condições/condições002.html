<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>País de Origem</title>
</head>
<body>
    <h1>Nacionalidade</h1>
    <p>Você é brasileiro? <input type="text" name="nasc" id="nasc"></p>
    <input type="button" value="verificar" onclick="Click()">
    <div id="res"></div>

    <script>

        function Click() {
            var nasc = window.document.getElementById('nasc')

            var res = window.document.getElementById('res')

            var resultado = String(nasc.value)


            if (resultado != 'sim') {
                res.innerHTML = `Você é Estrangeiro`
            } else {
                res.innerHTML = `Você é Brasileiro`
            }

           
        }

    </script>
</body>
</html>
