<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou Ímpar</title>
</head>
<body>
    <h1>Par ou Ímpar</h1>

    <input type="text" name="valor" id="valor">
    <input type="button" value="Verificar" onclick="Click()">
    <div id="res"></div>

    <script>

        function Click() {

        var valor = window.document.getElementById('valor')
        resultado = Number(valor.value)
        var res = window.document.getElementById('res')

        if (resultado  % 2 == 0) {
            res.innerHTML = '<p>PAR</p>'
        } else {
            res.innerHTML = '<p>ÍMPAR</p>'
        }

        }

    </script>
</body>
</html>
